---
name: "Test"

on:
  - "workflow_call"

env:
  COLORTERM: "yes"
  TERM: "xterm-256color"
  PYTEST_ADDOPTS: "--color=yes"
  CONTAINER_RUNTIME: "docker"

jobs:
  test:
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            ansible: "stable-2.19"
            lower_bounds: true
            image_tag: "latest"
          - python: "3.13"
            ansible: "stable-2.20"
          - python: "3.14"
            ansible: "stable-2.21"
            image_tag: "nightly"
            lower_bounds: true
    steps:
      - uses: "actions/checkout@v6"
      - uses: "actions/cache@v5"
        with:
          path: "~/.cache/pip"
          key: "${{ runner.os }}-pip-${{ hashFiles('**/*requirements*.txt', '**/*constraints*.lock', '**/setup.py', '**/pyproject.toml') }}"
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "${{ matrix.python }}"
      - name: "Install Ansible"
        run: |
          pip install git+https://github.com/ansible/ansible.git@${{ matrix.ansible }}
      - name: "Install dependencies"
        run: |
          make test-setup LOWER_BOUNDS="${{matrix.lower_bounds}}"
      - name: "Run basic tests"
        run: |
          make test
      - name: "Run live tests"
        run: |
          IMAGE_TAG=${{ matrix.image_tag }} tests/run_container.sh make livetest
        if: "${{ matrix.image_tag }}"
...
