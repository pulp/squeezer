[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.bumpversion]
current_version = "0.4.0"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(-(?P<release>[a-z]+))?"
serialize = [
  "{major}.{minor}.{patch}-{release}",
  "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
 "dev",
 "prod",
]

[[tool.bumpversion.files]]
filename = "./galaxy.yml"

[[tool.bumpversion.files]]
filename = "./plugins/module_utils/pulp_glue.py"
