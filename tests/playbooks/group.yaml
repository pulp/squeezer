---
- hosts: "localhost"
  gather_facts: false
  vars_files:
    - "vars/server.yaml"
  module_defaults: &pulp_module_defaults
    pulp.squeezer.group: &pulp_connection_details
      pulp_url: "{{ pulp_url }}"
      username: "{{ pulp_username }}"
      password: "{{ pulp_password }}"
      validate_certs: "{{ pulp_validate_certs | default(true) }}"
  tasks:
    - name: "Make group absent"
      pulp.squeezer.group:
        group:
          name: "test_group"
        state: "absent"
    - name: "Clean openapi cache"
      file:
        path: "{{ lookup('env', 'XDG_CACHE_HOME') | default('~/.cache') }}/squeezer"
        state: "absent"

- hosts: "tests"
  gather_facts: false
  vars_files:
    - "vars/server.yaml"
  module_defaults:
    <<: *pulp_module_defaults
  tasks:
    - name: "Create group"
      pulp.squeezer.group:
        group:
          name: "test_group"
        state: "present"
      register: "result"
    - name: "Verify create group"
      assert:
        that:
          - "result.changed == true"
          - "result.group.name == 'test_group'"

    - name: "Create group (2nd)"
      pulp.squeezer.group:
        group:
          name: "test_group"
        state: "present"
      register: "result"
    - name: "Verify create group (2nd)"
      assert:
        that:
          - "result.changed == false"

    - name: "List groups"
      pulp.squeezer.group: {}
      register: "result"
    - name: "Verify list groups"
      assert:
        that:
          - "result.changed == false"

    - name: "Show group"
      pulp.squeezer.group:
        group:
          name: "test_group"
      register: "result"
    - name: "Verify show group"
      assert:
        that:
          - "result.changed == false"
          - "result.group.name == 'test_group'"

    - name: "Delete group"
      pulp.squeezer.group:
        group:
          name: "test_group"
        state: "absent"
      register: "result"
    - name: "Verify delete group"
      assert:
        that:
          - "result.changed == true"

    - name: "Delete group (2nd)"
      pulp.squeezer.group:
        group:
          name: "test_group"
        state: "absent"
      register: "result"
    - name: "Verify delete group (2nd)"
      assert:
        that:
          - "result.changed == false"
...
