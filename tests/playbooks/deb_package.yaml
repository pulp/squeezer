---
- hosts: "localhost"
  gather_facts: false
  vars_files:
    - "vars/server.yaml"
  module_defaults: &pulp_module_defaults
    pulp.squeezer.deb_package: &pulp_connection_details
      pulp_url: "{{ pulp_url }}"
      username: "{{ pulp_username }}"
      password: "{{ pulp_password }}"
      validate_certs: "{{ pulp_validate_certs | default(true) }}"
    pulp.squeezer.deb_repository:
      <<: *pulp_connection_details
    pulp.squeezer.delete_orphans:
      <<: *pulp_connection_details
  tasks:
    - name: "Make repositories absent"
      pulp.squeezer.deb_repository:
        name: "{{ item }}"
        state: "absent"
      loop:
        - "test_deb_repository"
        - "test_deb_repository2"
    - name: "Create repositories"
      pulp.squeezer.deb_repository:
        name: "{{ item }}"
        state: "present"
      loop:
        - "test_deb_repository"
        - "test_deb_repository2"
    - name: "Delete orphans"
      pulp.squeezer.delete_orphans:
        protection_time: 0
    - name: "Clean openapi cache"
      ansible.builtin.file:
        path: "{{ lookup('env', 'XDG_CACHE_HOME') | default('~/.cache') }}/squeezer"
        state: "absent"

- hosts: "tests"
  gather_facts: false
  vars_files:
    - "vars/server.yaml"
  vars:
    deb1_sha256: "{{ lookup('file', 'data/geirrodr_1.0_armeb.deb', lstrip=false, rstrip=false) | hash('sha256') }}"
    deb1_path: "data/geirrodr_1.0_armeb.deb"
  module_defaults:
    <<: *pulp_module_defaults
  tasks:
    - name: "Create deb package"
      pulp.squeezer.deb_package:
        digest: "{{ deb1_sha256 }}"
        file: "{{ deb1_path }}"
        repository: "test_deb_repository"
        state: "present"
      register: "result"
    - name: "Verify create deb package"
      ansible.builtin.assert:
        that:
          - "result.changed == true"
          - "result.package.sha256 == deb1_sha256 or ansible_check_mode"

    - name: "Create deb package (2nd try)"
      pulp.squeezer.deb_package:
        digest: "{{ deb1_sha256 }}"
        file: "{{ deb1_path }}"
        repository: "test_deb_repository"
        state: "present"
      register: "result"
    - name: "Verify create deb package (2nd try)"
      ansible.builtin.assert:
        that:
          - "result.changed == false"

    - name: "Upload deb into different repository"
      pulp.squeezer.deb_package:
        file: "{{ deb1_path }}"
        repository: "test_deb_repository2"
        state: "present"
      register: "result"
    - name: "Verify upload deb into different repository"
      ansible.builtin.assert:
        that:
          - "result.changed == true"

    - name: "Remove deb from other repository"
      pulp.squeezer.deb_package:
        file: "{{ deb1_path }}"
        repository: "test_deb_repository2"
        state: "absent"
      register: "result"
    - name: "Verify remove deb from other repository"
      assert:
        that:
          - "result.changed == true"

    - name: "List deb packages in repository"
      pulp.squeezer.deb_package:
        repository: "test_deb_repository"
      register: "result"
    - name: "Verify list deb packages in repository"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.packages | length == 1"
          - "result.packages[0].sha256 == deb1_sha256"

    - name: "List deb packages in other repository"
      pulp.squeezer.deb_package:
        repository: "test_deb_repository2"
      register: "result"
    - name: "Verify list deb packages in other repository"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.packages | length == 0"

    - name: "List deb packages"
      pulp.squeezer.deb_package: {}
      register: "result"
    - name: "Verify list deb packages"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.packages | length >= 1"

    - name: "Read deb package"
      pulp.squeezer.deb_package:
        digest: "{{ deb1_sha256 }}"
      register: "result"
    - name: "Verify read deb package"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.package.sha256 == deb1_sha256"
...
