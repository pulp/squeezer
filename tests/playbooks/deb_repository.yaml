---
- hosts: localhost
  gather_facts: false
  vars_files:
    - vars/server.yaml
  module_defaults: &pulp_module_defaults
    pulp.squeezer.deb_repository: &pulp_connection_details
      pulp_url: "{{ pulp_url }}"
      username: "{{ pulp_username }}"
      password: "{{ pulp_password }}"
      validate_certs: "{{ pulp_validate_certs | default(true) }}"
    pulp.squeezer.deb_remote:
      <<: *pulp_connection_details
  tasks:
    - name: Make repository absent
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        state: absent
    - name: Make remote absent
      pulp.squeezer.deb_remote:
        name: test_deb_remote
        state: absent
    - name: Make remote present
      pulp.squeezer.deb_remote:
        name: test_deb_remote
        url: "{{ pulp_fixtures_url }}/debian/"
        architectures: ppc64
        components:
          - jotunheimr
        distributions:
          - ragnarok
        state: present
    - name: Clean openapi cache
      file:
        path: "{{ lookup('env', 'XDG_CACHE_HOME') | default('~/.cache') }}/squeezer"
        state: absent

- hosts: tests
  gather_facts: false
  vars_files:
    - vars/server.yaml
  module_defaults:
    <<: *pulp_module_defaults
  tasks:
    - name: Retrieve remote
      pulp.squeezer.deb_remote:
        name: test_deb_remote
      register: remote_result

    - name: Create repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        description: ""
        state: present
      register: result
    - name: Verify create repository
      assert:
        that:
          - result.changed == true
          - result.repository.name == 'test_deb_repository'

    - name: Create repository (2nd try)
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        state: present
      register: result
    - name: Verify create repository (2nd try)
      assert:
        that:
          - result.changed == false

    - name: Add description to repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        description: "repository created via ansible"
        state: present
      register: result
    - name: Verify add description to repository
      assert:
        that:
          - result.changed == true
          - result.repository.description == "repository created via ansible"

    - name: Add description to repository (2nd try)
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        description: "repository created via ansible"
        state: present
      register: result
    - name: Verify add description to repository (2nd try)
      assert:
        that:
          - result.changed == false

    - name: Add remote to repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        remote: test_deb_remote
        state: present
      register: result
    - name: Verify modify the repository with a remote
      assert:
        that:
          - result.changed == true
          - result.repository.description == "repository created via ansible"
          - result.repository.remote.startswith('/pulp/api/v3/remotes/deb/apt/')

    - name: Add remote to repository (2nd try)
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        remote: test_deb_remote
        state: present
      register: result
    - name: Verify modify the repository with a remote (2nd try)
      assert:
        that:
          - result.changed == false

    - name: Add pulp_labels (dict) to repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        pulp_labels:
          test_label: "1"
        state: present
      register: result
    - name: Verify add pulp_labels (dict) to repository
      assert:
        that:
          - 'result.changed == true'
          - 'result.repository.pulp_labels == {"test_label": "1"}'

    - name: Add pulp_labels (string) to repository (Validate no change)
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        pulp_labels: '{"test_label": "1"}'
        state: present
      register: result
    - name: Verify add pulp_labels (string) to repository (Validate no change)
      assert:
        that:
          - 'result.changed == false'

    - name: Fake modify repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        state: present
      register: result
    - name: Verify fake modify repository
      assert:
        that:
          - result.changed == false
          - result.repository.description == "repository created via ansible"

    - name: List repositories
      pulp.squeezer.deb_repository: {}
      register: result
    - name: Verify list repositories
      assert:
        that:
          - result.changed == false
          - result.repositories | length >= 1

    - name: Read repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
      register: result
    - name: Verify read repository
      assert:
        that:
          - result.changed == false
          - result.repository.name == 'test_deb_repository'
          - result.repository.description == "repository created via ansible"

    - name: Remove description from repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        description: ""
        state: present
      register: result
    - name: Verify remove description from repository
      assert:
        that:
          - result.changed == true
          - not result.repository.description

    - name: Remove description from repository (2nd try)
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        description: ""
        state: present
      register: result
    - name: Verify remove description from repository (2nd try)
      assert:
        that:
          - result.changed == false

    - name: Remove remote from repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        remote: ""
        state: present
      register: result
    - name: Verify remove remote from repository
      assert:
        that:
          - result.changed == true
          - not result.repository.remote

    - name: Remove remote from repository (2nd try)
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        remote: ""
        state: present
      register: result
    - name: Verify remove remote from repository (2nd try)
      assert:
        that:
          - result.changed == false

    - name: Delete repository
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        state: absent
      register: result
    - name: Verify delete repository
      assert:
        that:
          - result.changed == true
          - not result.repository

    - name: Delete repository (2nd try)
      pulp.squeezer.deb_repository:
        name: test_deb_repository
        state: absent
      register: result
    - name: Verify delete repository (2nd try)
      assert:
        that:
          - result.changed == false

- hosts: localhost
  gather_facts: false
  vars_files:
    - vars/server.yaml
  module_defaults:
    <<: *pulp_module_defaults
  tasks:
    - name: Make remote absent
      pulp.squeezer.deb_remote:
        name: test_deb_remote
        state: absent
      register: result
...
