---
- hosts: "localhost"
  gather_facts: false
  vars_files:
    - "vars/server.yaml"
  module_defaults: &pulp_module_defaults
    pulp.squeezer.rpm_package: &pulp_connection_details
      pulp_url: "{{ pulp_url }}"
      username: "{{ pulp_username }}"
      password: "{{ pulp_password }}"
      validate_certs: "{{ pulp_validate_certs | default(true) }}"
    pulp.squeezer.rpm_repository:
      <<: *pulp_connection_details
    pulp.squeezer.delete_orphans:
      <<: *pulp_connection_details
  tasks:
    - name: "Make repositories absent"
      pulp.squeezer.rpm_repository:
        name: "{{ item }}"
        state: "absent"
      loop:
        - "test_rpm_repository"
        - "test_rpm_repository2"
    - name: "Create repositories"
      pulp.squeezer.rpm_repository:
        name: "{{ item }}"
        state: "present"
      loop:
        - "test_rpm_repository"
        - "test_rpm_repository2"
    - name: "Delete orphans"
      pulp.squeezer.delete_orphans:
        protection_time: 0
    - name: "Clean openapi cache"
      ansible.builtin.file:
        path: "{{ lookup('env', 'XDG_CACHE_HOME') | default('~/.cache') }}/squeezer"
        state: "absent"

- hosts: "tests"
  gather_facts: false
  vars_files:
    - "vars/server.yaml"
  vars:
    rpm1_sha256: "{{ lookup('file', 'data/fox-1.1-2.noarch.rpm', lstrip=false, rstrip=false) | hash('sha256') }}"
    rpm1_path: "data/fox-1.1-2.noarch.rpm"
  module_defaults:
    <<: *pulp_module_defaults
  tasks:
    - name: "Create rpm package"
      pulp.squeezer.rpm_package:
        digest: "{{ rpm1_sha256 }}"
        file: "{{ rpm1_path }}"
        repository: "test_rpm_repository"
        state: "present"
      register: "result"
    - name: "Verify create rpm package"
      ansible.builtin.assert:
        that:
          - "result.changed == true"
          - "result.package.sha256 == rpm1_sha256 or ansible_check_mode"

    - name: "Create rpm package (2nd try)"
      pulp.squeezer.rpm_package:
        digest: "{{ rpm1_sha256 }}"
        file: "{{ rpm1_path }}"
        repository: "test_rpm_repository"
        state: "present"
      register: "result"
    - name: "Verify create rpm package (2nd try)"
      ansible.builtin.assert:
        that:
          - "result.changed == false"

    - name: "Upload rpm into different repository"
      pulp.squeezer.rpm_package:
        file: "{{ rpm1_path }}"
        repository: "test_rpm_repository2"
        state: "present"
      register: "result"
    - name: "Verify upload rpm into different repository"
      ansible.builtin.assert:
        that:
          - "result.changed == true"

    - name: "Remove rpm from other repository"
      pulp.squeezer.rpm_package:
        file: "{{ rpm1_path }}"
        repository: "test_rpm_repository2"
        state: "absent"
      register: "result"
    - name: "Verify remove rpm from other repository"
      assert:
        that:
          - "result.changed == true"

    - name: "List rpm packages in repository"
      pulp.squeezer.rpm_package:
        repository: "test_rpm_repository"
      register: "result"
    - name: "Verify list rpm packages in repository"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.packages | length == 1"
          - "result.packages[0].sha256 == rpm1_sha256"

    - name: "List rpm packages in other repository"
      pulp.squeezer.rpm_package:
        repository: "test_rpm_repository2"
      register: "result"
    - name: "Verify list rpm packages in other repository"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.packages | length == 0"

    - name: "List rpm packages"
      pulp.squeezer.rpm_package: {}
      register: "result"
    - name: "Verify list rpm packages"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.packages | length >= 1"

    - name: "Read rpm package"
      pulp.squeezer.rpm_package:
        digest: "{{ rpm1_sha256 }}"
      register: "result"
    - name: "Verify read rpm package"
      ansible.builtin.assert:
        that:
          - "result.changed == false"
          - "result.package.sha256 == rpm1_sha256"
...
